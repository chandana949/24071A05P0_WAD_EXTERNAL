<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart App</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    background:#f4f4f4;
}

/* Header */
header{
    background:#222;
    color:#fff;
    padding:1rem 2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#welcome{
    margin-left:auto;
    margin-right:20px;
    font-weight:bold;
}

/* Container */
.container{
    max-width:1100px;
    margin:auto;
    padding:1rem;
}

/* Forms */
form{
    max-width:400px;
    margin:2rem auto;
    background:#fff;
    padding:1.5rem;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

form h3{
    text-align:center;
    margin-bottom:1rem;
}

input{
    width:100%;
    padding:0.7rem;
    margin:0.5rem 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:0.7rem;
    width:100%;
    border:none;
    background:#222;
    color:#fff;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#444;
}

.error{
    color:red;
    font-size:0.9rem;
    margin-top:5px;
}

/* Product Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:1rem;
    margin-top:1rem;
}

.card{
    background:#fff;
    padding:1rem;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
}

.card h4{
    margin-bottom:10px;
}

.card p{
    font-size:18px;
    font-weight:bold;
}

.card button{
    margin-top:auto;
}

/* Cart */
.cart{
    background:#fff;
    margin-top:2rem;
    padding:1rem;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.1);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.total{
    margin-top:1rem;
    font-size:20px;
    font-weight:bold;
    text-align:right;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<!-- Header -->
<header>
    <div><strong>My Shop</strong></div>

    <div id="welcome"></div>

    <button onclick="logout()" style="width:auto;padding:10px 20px;">
        Logout
    </button>
</header>

<!-- Register Form -->
<form id="registerForm">
    <h3>Register</h3>

    <input id="fName" placeholder="First Name">

    <input id="lName" placeholder="Last Name">

    <input id="rUser" placeholder="Username">

    <input id="email" type="email" placeholder="Email">

    <input id="phone" type="tel" placeholder="Phone Number">

    <input id="rPass" type="password" placeholder="Password">

    <input id="cPass" type="password" placeholder="Confirm Password">

    <div class="error" id="rErr"></div>

    <button type="submit">Register</button>
</form>

<!-- Login Form -->
<form id="loginForm" class="hidden">
    <h3>Login</h3>

    <input id="lUser" placeholder="Username">

    <input id="lPass" type="password" placeholder="Password">

    <div class="error" id="lErr"></div>

    <button type="submit">Login</button>
</form>

<!-- Shop -->
<div id="shop" class="container hidden">

    <h2>Product Catalog</h2>

    <div class="grid" id="products"></div>

    <!-- Cart -->
    <div class="cart">
        <h3>Shopping Cart</h3>

        <div id="cart"></div>

        <div class="total" id="total">
            Total: ₹0
        </div>
    </div>

</div>

<script>
// Products Data
const products = [
    { id: 1, name: "Phone", price: 500 },
    { id: 2, name: "Laptop", price: 1000 },
    { id: 3, name: "Headphones", price: 150 },
    { id: 4, name: "Smart Watch", price: 300 },
    { id: 5, name: "Keyboard", price: 80 },
    { id: 6, name: "Mouse", price: 50 }
];

// Cart
let cart = [];

/* =========================
   REGISTER
========================= */
registerForm.onsubmit = (e) => {
    e.preventDefault();

    // Clear previous error
    rErr.textContent = "";

    // Validation
    if(
        !fName.value ||
        !lName.value ||
        !rUser.value ||
        !email.value ||
        !phone.value ||
        !rPass.value ||
        !cPass.value
    ){
        rErr.textContent = "Please fill all fields";
        return;
    }

    // Email Validation
    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if(!email.value.match(emailPattern)){
        rErr.textContent = "Please enter a valid email";
        return;
    }

    // Mobile Number Validation
    // Must contain exactly 10 digits
    const phonePattern = /^[0-9]{10}$/;

    if(!phone.value.match(phonePattern)){
        rErr.textContent =
            "Mobile number must contain exactly 10 digits";
        return;
    }

    // Password Validation
    if(rPass.value.length < 6){
        rErr.textContent =
            "Password must be at least 6 characters";
        return;
    }

    // Confirm Password Validation
    if(rPass.value !== cPass.value){
        rErr.textContent = "Passwords do not match";
        return;
    }

    // Save Data
    localStorage.setItem("firstname", fName.value);
    localStorage.setItem("lastname", lName.value);
    localStorage.setItem("username", rUser.value);
    localStorage.setItem("email", email.value);
    localStorage.setItem("phone", phone.value);
    localStorage.setItem("password", rPass.value);

    alert("Registration Successful!");

    // Switch Forms
    registerForm.classList.add("hidden");
    loginForm.classList.remove("hidden");
};

/* =========================
   LOGIN
========================= */
loginForm.onsubmit = (e) => {
    e.preventDefault();

    const savedUser = localStorage.getItem("username");
    const savedPass = localStorage.getItem("password");

    if(
        lUser.value !== savedUser ||
        lPass.value !== savedPass
    ){
        lErr.textContent = "Invalid Username or Password";
        return;
    }

    lErr.textContent = "";

    // Hide Login
    loginForm.classList.add("hidden");

    // Show Shop
    shop.classList.remove("hidden");

    // Welcome Text
    welcome.textContent =
        "Welcome " +
        localStorage.getItem("firstname") +
        " " +
        localStorage.getItem("lastname");

    // Load Products
    loadProducts();
};

/* =========================
   LOAD PRODUCTS
========================= */
function loadProducts(){

    const productsDiv = document.getElementById("products");

    productsDiv.innerHTML = "";

    products.forEach(product => {

        const div = document.createElement("div");

        div.className = "card";

        div.innerHTML = `
            <h4>${product.name}</h4>

            <p>₹${product.price}</p>

            <button onclick="addToCart(${product.id})">
                Add to Cart
            </button>
        `;

        productsDiv.appendChild(div);
    });
}

/* =========================
   ADD TO CART
========================= */
function addToCart(id){

    const product = products.find(p => p.id === id);

    cart.push(product);

    renderCart();
}

/* =========================
   RENDER CART
========================= */
function renderCart(){

    const cartDiv = document.getElementById("cart");

    const totalDiv = document.getElementById("total");

    cartDiv.innerHTML = "";

    let total = 0;

    cart.forEach((item,index) => {

        total += item.price;

        cartDiv.innerHTML += `
            <div class="cart-item">

                <span>
                    ${item.name}
                </span>

                <span>
                    ₹${item.price}
                </span>

            </div>
        `;
    });

    totalDiv.textContent = "Total: ₹" + total;
}

/* =========================
   LOGOUT
========================= */
function logout(){
    location.reload();
}
</script>

</body>
</html>
